name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check application and deployment syntax
        run: |
          node --check server.js
          node --check supervisor.js
          node --check src/服务端/应用.js
          node --check src/服务端/管理员认证.js
          node --check src/服务端/用户认证.js
          node --check src/服务端/配置.js
          node --check src/服务端/数据库.js
          node --check src/服务端/HTTP响应.js
          node --check src/服务端/小说来源.js
          node --check src/服务端/番茄小说下载.js
          node --check src/服务端/自更新.js
          node --check public/后台界面/管理后台.js
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('src/小说下载/番茄正文下载器.py').read_text(encoding='utf-8'))"
          sh -n 部署/一键部署.sh
          docker compose config --quiet

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
