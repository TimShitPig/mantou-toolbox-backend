name: mantou-toolbox

services:
  backend:
    container_name: mantou-toolbox
    image: "${BACKEND_IMAGE:-ghcr.io/timshitpig/mantou-toolbox-backend:latest}"
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${PUBLIC_PORT:-8787}:8787"
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      HOST: "0.0.0.0"
      PORT: "8787"
      APP_BASE_URL: "${APP_BASE_URL:-http://127.0.0.1:${PUBLIC_PORT:-8787}}"
      APP_SECRET: "${APP_SECRET:-change-this-secret-before-production}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      UPDATE_AGENT_URL: "http://updater:8787"
      UPDATE_AGENT_SECRET: "${UPDATE_AGENT_SECRET:-${APP_SECRET:-}}"
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:-*}"
      ALLOW_DEVELOPMENT_LOGIN: "${ALLOW_DEVELOPMENT_LOGIN:-false}"
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-30}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      DOWNLOAD_ENABLED: "${DOWNLOAD_ENABLED:-true}"
      PARSE_ENABLED: "${PARSE_ENABLED:-true}"
      QIMAO_ENABLED: "${QIMAO_ENABLED:-true}"
      FANQIE_ENABLED: "${FANQIE_ENABLED:-true}"
      FANQIE_KEYS_CONFIGURED: "${FANQIE_KEYS_CONFIGURED:-false}"
      DOWNLOAD_LIMIT: "${DOWNLOAD_LIMIT:-0}"
      REWARDED_AD_ENABLED: "${REWARDED_AD_ENABLED:-false}"
      REWARDED_AD_EVERY_DOWNLOADS: "${REWARDED_AD_EVERY_DOWNLOADS:-3}"
      CLOUD_DIRECT_LINK_ENABLED: "${CLOUD_DIRECT_LINK_ENABLED:-true}"
      REMOTE_METADATA_ENABLED: "${REMOTE_METADATA_ENABLED:-false}"
      CONTENT_CATALOG_FILE: "${CONTENT_CATALOG_FILE:-}"
      CONTENT_PROVIDER_URL: "${CONTENT_PROVIDER_URL:-}"
      IMAGE_PROXY_ALLOWLIST: "${IMAGE_PROXY_ALLOWLIST:-qimao.com,wtzw.com,fanqienovel.com,fqnovel.com,changdunovel.com}"
    depends_on:
      updater:
        condition: service_healthy
    volumes:
      - mantou-storage:/app/storage
      # Put an authorized catalog at ./content/catalog.json and set
      # CONTENT_CATALOG_FILE=./content/catalog.json in .env when needed.
      - "${CONTENT_DIR:-./content}:/app/content:ro"
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:8787/healthz'); if (!r.ok) process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  updater:
    container_name: mantou-toolbox-updater
    image: "${UPDATE_AGENT_IMAGE:-ghcr.io/timshitpig/mantou-toolbox-backend:latest}"
    pull_policy: always
    command: ["node", "--no-warnings", "src/update-agent.js"]
    restart: unless-stopped
    user: "0:0"
    environment:
      UPDATE_AGENT_SECRET: "${UPDATE_AGENT_SECRET:-${APP_SECRET:-}}"
      UPDATE_AGENT_IMAGE: "${UPDATE_AGENT_IMAGE:-${BACKEND_IMAGE:-ghcr.io/timshitpig/mantou-toolbox-backend:latest}}"
      UPDATE_AGENT_PORT: "8787"
      UPDATE_TARGET_NAME: "mantou-toolbox"
      UPDATE_DEPLOY_DIR: "${UPDATE_DEPLOY_DIR:-${PWD:-/workspace}}"
      UPDATE_PROJECT_NAME: "mantou-toolbox"
      UPDATE_MODE: "compose"
      UPDATE_AGENT_STATE_FILE: "/app/storage/update-agent-state.json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mantou-storage:/app/storage
      - "${UPDATE_DEPLOY_DIR:-${PWD:-.}}:${UPDATE_DEPLOY_DIR:-${PWD:-/workspace}}"
    working_dir: "${UPDATE_DEPLOY_DIR:-${PWD:-/workspace}}"
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:8787/healthz'); if (!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  mantou-storage:
